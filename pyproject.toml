[project]
name = "scribelocal"
version = "0.1.0"
description = "Local-first meeting transcription + AI summaries (record-then-process)"
requires-python = ">=3.11"
dependencies = [
    "pyaudiowpatch>=0.2.12",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
transcribe = ["faster-whisper>=1.0"]
summarize = ["anthropic>=0.40"]
server = ["fastapi>=0.110", "uvicorn>=0.29", "watchfiles>=0.21"]
diarize = ["pyannote.audio>=3.1"]

[project.scripts]
scribe = "scribe.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["scribe*"]

[tool.setuptools.package-data]
"scribe.server" = ["static/*"]
